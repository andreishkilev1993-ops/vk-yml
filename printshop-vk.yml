. Кормушка подойдет для любителей природы и станет отличным дополнением к вашему саду или даче, создавая атмосферу спокойствия и уюта.</description><price>1000</price><currencyId>RUR</currencyId><categoryId>23</categoryId><picture>https://sun9-62.vkuserphoto.ru/s/v1/ig2/amx6MQdW-PMjRSA3DUhX7A3SKvRoTcEXqtLTkdglZNFv9VvWBH9HGobXhziC_Jv1OeYx9KNvYuOiuTqwMh11G24v.jpg?quality=96&amp;as=32x24%2C48x36%2C72x54%2C108x81%2C160x120%2C240x180%2C360x270%2C480x360%2C540x405%2C640x480%2C720x540%2C1080x810%2C1280x960%2C1440x1080%2C1448x1086&amp;from=bu&amp;cs=1448x0</picture><url>https://makerworld.com/ru/models/2855857-leaf-nest-bird-feeder</url><vendor>Dratek</vendor></offer><offer id="printshop-349" available="true"><name>Контейнер-сердце с крышкой</name><description>Этот милый контейнер в форме сердца — это не только забавный, но и функциональный ящик для хранения мелочей, таких как конфеты, украшения, кольца или предметы для ванной. Рельефный узор в виде сердца придает ему уютный и приятный вид, что делает его идеальным для вашего стола, полки, тумбочки или кухонного стола. Контейнер оснащен крышкой с удобной ручкой и не требует сборки — он напечатан в одном экземпляре. Вы можете использовать его для организации мелочей, декорирования вашего пространства или просто как симпатичный аксессуар. Изготовлен из пластика для 3D-печати, легко очищается — достаточно протереть сухой или слегка влажной тканью, беречь от сильного нагрева. Этот контейнер станет отличным решением для тех, кто ценит порядок и стиль в своем окружении.</description><price>400</price><currencyId>RUR</currencyId><categoryId>19</categoryId><picture>https://sun9-70.vkuserphoto.ru/s/v1/ig2/y_U69chhjEow_Vt563uRU2IS4Kj5pEMrcJHkr0y2EodJMqTPE0m7Bc1CPiowcFNM__ucJXpqHccUA6YzSrgYYamp.jpg?quality=96&amp;as=32x24%2C48x36%2C72x54%2C108x81%2C160x120%2C240x180%2C360x270%2C480x360%2C540x405%2C640x480%2C720x540%2C1080x810%2C1280x960%2C1440x1080%2C1600x1200&amp;from=bu&amp;cs=1600x0</picture><url>https://makerworld.com/ru/models/15