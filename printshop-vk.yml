<yml_catalog date="2026-08-20 20:15"><shop><name>Printshop</name><company>Printshop</company><url>https://vk.com/club240594842</url><currencies><currency id="RUR" rate="1" /></currencies><categories><category id="17">Игры и развитие</category><category id="18">Интерьер дома</category><category id="19">Подарки для девочек</category><category id="20">Порядок на столе</category><category id="21">Кухня и сервировка</category><category id="22">Йога и медитация</category><category id="23">Для питомцев</category></categories><offers><offer id="printshop-1" available="true"><name>Держатель для пульта</name><description>Держатель для пульта — это стильное и практичное решение для организации вашего пространства. Он позволяет удобно хранить пульты дистанционного управления, избавляя от беспорядка и упрощая доступ к ним. Доступен в двух вариантах: на 2 и 4 пульта, что позволяет выбрать оптимальный размер для вашего интерьера. Компактный дизайн позволяет разместить его на кофейном столике, тумбе под телевизор или полке, добавляя изысканный акцент в ваш интерьер в стиле Japandi. Изготовлен из пластика для 3D-печати, он легок в уходе: достаточно протирать его сухой или слегка влажной тканью и беречь от сильного нагрева. Этот держатель станет отличным дополнением для гостиной, спальни или зоны развлечений, обеспечивая порядок и стиль в вашем доме.</description><price>600</price><currencyId>RUR</currencyId><categoryId>18</categoryId><picture>https://sun9-51.vkuserphoto.ru/s/v1/ig2/ZK4Rto8N5GlSiD09AxKupYi7q04hmOT5hfJZnTxKQqENBVstUP_ZMYYfSS1ope_HO6UAzWOPpFkqX18N7PqnCSHu.jpg?quality=96&amp;as=32x24%2C48x36%2C72x54%2C108x81%2C160x120%2C240x180%2C360x270%2C480x360%2C540x405%2C640x480%2C720x540%2C1024x768&amp;from=bu&amp;cs=1024x0</picture><url>https://makerworld.com/en/models/3152818-remote-control-holder-japandi</url><vendor>Kien Designs</vendor></offer><offer id="printshop-4" available="true"><name>Лиса в стиле japandi</name><description>Эта стильная фигурка лисы в стиле japandi станет изысканным дополнением вашего интерьера. Она идеально впишется в современные и минималистичные пространства, добавляя нотки уюта и оригинальности. Изготовленная из пластика для 3D-печати, фигурка отличается высокой прочностью и долговечностью. Вы можете разместить её на столе, полке или в витрине, она станет ярким акцентом в вашем доме или офисе. Уход за фигуркой прост: достаточно протирать её сухой или слегка влажной тканью, а также беречь от сильного нагрева. Этот предмет станет отличным подарком для любителей уникального дизайна и ценителей японской эстетики.</description><price>399</price><currencyId>RUR</currencyId><categoryId>18</categoryId><picture>https://sun9-42.vkuserphoto.ru/s/v1/ig2/qNFp_j4-GKhuC_2kAKlXHaILQ6R6Z7J-hABJDibKwUOtGeD8R-pXeCs_6kn3RT4l50YumVsWs6mNVyxEjVyUZihk.jpg?quality=96&amp;as=32x24%2C48x36%2C72x54%2C108x81%2C160x120%2C240x180%2C360x270%2C480x360%2C540x405%2C640x480%2C720x540%2C1080x810%2C1280x960%2C1440x1080%2C1448x1086&amp;from=bu&amp;cs=1448x0</picture><url>https://makerworld.com/en/models/3156254-fox-cute-animal-stylish-japandi-style</url><vendor>NowCraft3D</vendor></offer><offer id="printshop-5" available="true"><name>Часы Voronoi на стену</name><description>Эти часы Voronoi — стильный элемент декора для вашего интерьера. Они объединяют современный дизайн 3D-печати с естественной эстетикой, что делает их идеальными для любого помещения. Часы имеют модульную конструкцию, позволяющую легко менять лицевую панель, что дает возможность адаптировать их под ваш стиль. Вы можете выбрать из четырех различных рамок и двух лицевых панелей, чтобы создать уникальный предмет, который будет радовать глаз. Изготовлены из пластика для 3D-печати, они легки в уходе: достаточно протирать их сухой или слегка влажной тканью и беречь от сильного нагрева. Эти часы отлично подойдут для дома, офиса или студии, добавляя нотку современности и оригинальности. Они станут отличным подарком для ценителей дизайна и искусства. Привнесите в ваше пространство уникальный акцент с помощью этих часов.</description><price>2381</price><currencyId>RUR</currencyId><categoryId>18</categoryId><picture>https://sun9-12.vkuserphoto.ru/s/v1/ig2/pr4He4Yci10iqTvNqtW88OgU7smghOCMDSo2dzAcBY4hd2LQqfW_rKDNjGH8qU8Vnm-8ciUSNsh0YimXaesLqyOe.jpg?quality=96&amp;as=32x24%2C48x36%2C72x54%2C108x81%2C160x120%2C240x180%2C360x270%2C480x360%2C540x405%2C640x480%2C720x540%2C1080x810%2C1280x960%2C1313x985&amp;from=bu&amp;cs=1313x0</picture><url>https://makerworld.com/en/models/3156005-modern-voronoi-wall-clock-organic-or-circular</url><vendor>Artimago</vendor></offer><offer id="printshop-6" available="true"><name>Пара оленей Japandi</name><description>Эта пара оленей — стильный элемент декора в стиле Japandi и Nordic. Они идеально подойдут для украшения полок, столов и каминов, добавляя изысканность в ваш интерьер. Олени выполнены с плавными линиями и элегантными рогами, что делает их универсальными для любого современного пространства. Вы можете выбрать их в подходящих или контрастных цветах, создавая уникальный набор, который будет радовать глаз. Эти фигурки также станут прекрасным зимним или рождественским украшением. Изготовлены из пластика для 3D-печати, их легко поддерживать в чистоте — достаточно протирать сухой или слегка влажной тканью. Берегите от сильного нагрева, чтобы сохранить их первоначальный вид. Этот декор станет отличным подарком для ценителей минимализма и современного дизайна.</description><price>170</price><currencyId>RUR</currencyId><categoryId>18</categoryId><picture>https://sun9-73.vkuserphoto.ru/s/v1/ig2/lgbHzWJuArJG9iHJeQqdzzgzwTeDNJem_5eUnvZSfVzmZrWhaaANk6K2FPsGOoG8KfPKzKbieuKY4earYuFAQ2Ms.jpg?quality=96&amp;as=32x24%2C48x36%2C72x54%2C108x81%2C160x120%2C240x180%2C360x270%2C480x360%2C540x405%2C640x480%2C720x540%2C1080x810%2C1280x960%2C1440x1080%2C1448x1086&amp;from=bu&amp;cs=1448x0</picture><url>https://makerworld.com/en/models/3164895-minimalist-deer-couple-japandi-christmas-home</url><vendor>NowCraft3D</vendor></offer><offer id="printshop-8" available="true"><name>Сканди-горшок с поддоном</name><description>Сканди-горшок с поддоном — это стильный и функциональный элемент для вашего интерьера. Он выполнен в современном скандинавском дизайне, который добавит уют и архитектурную изысканность в любое помещение. Горшок подходит для различных растений: от зелени до суккулентов, а также может использоваться как кашпо. В комплект входят поддон и вставка для дренажа, что обеспечивает правильный уход за растениями. Вы можете разместить горшок на столе, подоконнике или полке, создавая гармоничное оформление. Изготовлен из пластика для 3D-печати, он легкий и долговечный. Уход за горшком прост: достаточно протирать его сухой или слегка влажной тканью, избегая сильного нагрева. Этот горшок станет отличным выбором для любителей минимализма и тех, кто ценит стильные решения в интерьере.</description><price>599</price><currencyId>RUR</currencyId><categoryId>18</categoryId><picture>https://sun9-15.vkuserphoto.ru/s/v1/ig2/UIPuHAfuX9cT4oJHTdUTmktsjWpmOS_-SP7O9pxXwHwKN_2uG3WtjUNka1cGGrH1O0Kl_mJYgqZa1yXlybY4AX6f.jpg?quality=96&amp;as=32x24%2C48x36%2C72x54%2C108x81%2C160x120%2C240x180%2C360x270%2C480x360%2C540x405%2C640x480%2C720x540%2C1080x810%2C1280x960%2C1440x1080%2C1600x1200&amp;from=bu&amp;cs=1600x0</picture><url>https://makerworld.com/en/models/3166644-scandi-style-quilt-flower-pot-with-drainage-tray</url><vendor>Ikigaiform</vendor></offer><offer id="printshop-9" available="true"><name>Подсвечник «лесное яблоко»</name><description>Подсвечник в форме яблока создаст уютную атмосферу в вашем доме. Он выполнен из пластика для 3D-печати и украшен деталями в виде дубовых листьев и желудей, что придаёт ему природный шарм. Этот подсвечник идеально подойдёт для осеннего декора, добавляя тёплый свет в вечерние часы. Просто вставьте LED-свечу внутрь, и он заиграет новыми красками, создавая красивые тени и уютное освещение. Подсвечник станет отличным акцентом на столе, полке или камине, а также станет замечательным подарком для любителей природы и осенней эстетики. Уход за изделием прост: достаточно протирать его сухой или слегка влажной тканью, избегая сильного нагрева. Этот предмет станет не только функциональным аксессуаром, но и стильным элементом вашего интерьера на протяжении всей осени.</description><price>2704</price><currencyId>RUR</currencyId><categoryId>18</categoryId><picture>https://sun9-60.vkuserphoto.ru/s/v1/ig2/5ewlZJ2sMYK9VxPQnkMRnpyYwaaIWUHjJMKnIfwM2-V3G_MmQnfBe9Tn_eDV7v4n00hURmlBTKAvXUPZ-XSW_L5U.jpg?quality=96&amp;as=32x48%2C48x72%2C72x108%2C108x162%2C160x240%2C240x360%2C360x540%2C480x720%2C540x810%2C640x960%2C720x1080%2C1024x1536&amp;from=bu&amp;cs=1024x0</picture><url>https://makerworld.com/en/models/3169733-forest-fall-glow-apple-led-tealight-holder</url><vendor>Swee</vendor></offer><offer id="printshop-10" available="true"><name>Фонарик-жёлудь</name><description>Фонарик-жёлудь — это оригинальный элемент осеннего декора, который можно как установить на стол, так и повесить, используя специальную петлю. Внутри фонарика предусмотрено место для маленького баллонного света, что позволяет создать уютную атмосферу в вашем доме. Благодаря компактным размерам (высота около 50 мм) он легко впишется в любой интерьер. Вы можете выбрать цвет печати для достижения желаемого эффекта освещения: светлые оттенки лучше пропускают свет, а темные создают более мягкое свечение. Фонарик идеально подходит для украшения дома в осенний период, а также станет отличным подарком для любителей уютного декора. Изготовлен из пластика для 3D-печати, фонарик легко чистится — достаточно протереть его сухой или слегка влажной тканью. Берегите изделие от сильного нагрева, чтобы оно служило вам долго.</description><price>200</price><currencyId>RUR</currencyId><categoryId>18</categoryId><picture>https://sun9-23.vkuserphoto.ru/s/v1/ig2/OCkpGQISVOuw8pdH9MNwrLQk7k4KYWpyM0mTTFPZPw7BYCGMYd9ojnjEElCuCnsDaw-qQavVfybek3vGKrutKIyD.jpg?quality=96&amp;as=32x24%2C48x36%2C72x54%2C108x81%2C160x120%2C240x180%2C360x270%2C480x360%2C540x405%2C640x480%2C720x540%2C1080x810%2C1280x960%2C1440x1080%2C1448x1086&amp;from=bu&amp;cs=1448x0</picture><url>https://makerworld.com/en/models/3171935-mini-acorn-lantern-autumn-decoration</url><vendor>3DMerchandMore</vendor></offer><offer id="printshop-12" available="true"><name>Волнистая полка для духов</name><description>Эта волнистая полка для духов и косметики станет стильным дополнением вашего туалетного столика или рабочего места. Она сочетает в себе элегантный арочный дизайн для размещения любимых духов и милые ящички с волнистыми краями для аккуратного хранения косметики и аксессуаров. Полка выполнена из пластика для 3D-печати, что обеспечивает долговечность и легкость в уходе. Протирайте её сухой или слегка влажной тканью и бережно относитесь к источникам сильного нагрева. Преимущества: 1. Эстетичный арочный и волнистый дизайн, который добавит современности в ваш интерьер. 2. Специальный отсек для духов, который придаст вашим ароматам роскошный вид. 3. Многофункциональные ящики идеально подойдут для хранения косметики, заколок, украшений или мелких предметов на столе. 4. Легкость в сборке и печати благодаря продуманному дизайну. 5. Возможность создания в контрастных цветах, что позволяет адаптировать полку под любой интерьер. Эта полка станет отличным выбором для тех, кто ценит порядок и стиль в своем пространстве.</description><price>1500</price><currencyId>RUR</currencyId><categoryId>19</categoryId><picture>https://sun9-57.vkuserphoto.ru/s/v1/ig2/i8_iiyjgRD8tN536xK7_LwS7idJH2vxKoxa1IgW6kgfR16N6MVIqokqy_LUyOWacp12HFI9qAVBZPSYSV3rfsy8c.jpg?quality=96&amp;as=32x24%2C48x36%2C72x54%2C108x81%2C160x120%2C240x180%2C360x270%2C480x360%2C540x405%2C640x480%2C720x540%2C1080x810%2C1267x950&amp;from=bu&amp;cs=1267x0</picture><url>https://makerworld.com/en/models/3147383-wavy-makeup-perfume-shelf-organizer</url><vendor>Milumi</vendor></offer><offer id="printshop-14" available="true"><name>Кашпо rosais</name><description>Кашпо rosais — это современное