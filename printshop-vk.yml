<yml_catalog date="2026-08-20 22:49"><shop><name>Printshop</name><company>Printshop</company><url>https://vk.com/club240594842</url><currencies><currency id="RUR" rate="1" /></currencies><categories><category id="17">Игры и развитие</category><category id="18">Интерьер дома</category><category id="19">Подарки для девочек</category><category id="20">Порядок на столе</category><category id="21">Кухня и сервировка</category><category id="22">Йога и медитация</category><category id="23">Для питомцев</category></categories><offers><offer id="printshop-1" available="true"><name>Держатель для пульта</name><description>Держатель для пульта — это стильное и практичное решение для организации вашего пространства. Он позволяет удобно хранить пульты дистанционного управления, избавляя от беспорядка и упрощая доступ к ним. Доступен в двух вариантах: на 2 и 4 пульта, что позволяет выбрать оптимальный размер для вашего интерьера. Компактный дизайн позволяет разместить его на кофейном столике, тумбе под телевизор или полке, добавляя изысканный акцент в ваш интерьер в стиле Japandi. Изготовлен из пластика для 3D-печати, он легок в уходе: достаточно протирать его сухой или слегка влажной тканью и беречь от сильного нагрева. Этот держатель станет отличным дополнением для гостиной, спальни или зоны развлечений, обеспечивая порядок и стиль в вашем доме.</description><price>600</price><currencyId>RUR</currencyId><categoryId>18</categoryId><picture>https://sun9-51.vkuserphoto.ru/s/v1/ig2/ZK4Rto8N5GlSiD09AxKupYi7q04hmOT5hfJZnTxKQqENBVstUP_ZMYYfSS1ope_HO6UAzWOPpFkqX18N7PqnCSHu.jpg?quality=96&amp;from=bu&amp;cs=1024x0</picture><url>https://makerworld.com/en/models/3152818-remote-control-holder-japandi</url><vendor>Kien Designs</vendor></offer><offer id="printshop-2" available="true"><name>Диспенсер для ватных палочек</name><description>🌿 Fluted Cotton Swab Dispenser – Japandi Style A minimalist cotton swab (Q-tip) organizer that brings warm Japandi calm to your bathroom or vanity. The vertical fluted texture wraps the entire body for a soft, architectural look that fits modern, Scandinavian, and Japanese-inspired interiors. ✨ How it works Load from the top – lift the ribbed lid and fill the inner chamber with cotton swabs. Dispense from the bottom – swabs gently slide down into the front tray, so you can grab one at a time with ease. Stays dust-free – the fitted lid keeps everything clean and tidy. 💡 Notes Prints as two parts: body + lid . Designed for standard cotton swabs; scale slightly if needed for your local size. Wipe clean with a soft, dry cloth. If you enjoy this model, a ❤️ like, follow, or a quick &amp;#34;Make&amp;#34; really helps and keeps new designs coming. Happy printing! 🧡</description><price>299</price><currencyId>RUR</currencyId><categoryId>21</categoryId><picture>https://sun9-88.vkuserphoto.ru/s/v1/ig2/ZYzKeHbJEVe9PrUiFGqkE_uIwdNgIYkdDXqVp_JVz1E7bKRStmk2EJpalMQkv_t2Vbpu1xLK3cWiH9iDIk5AFBgE.jpg?quality=96&amp;from=bu&amp;cs=1254x0</picture><url>https://makerworld.com/en/models/3155070-japandi-fluted-cotton-swab-dispenser</url><vendor>Ldesign</vendor></offer><offer id="printshop-3" available="true"><name>Self-Draining Sink Caddy–Detergent,Sponge, Cutlery</name><description>Compact kitchen organizer designed to hold detergent, sponges, brushes, and other sink-side accessories. &amp;nbsp; The upper basket features a honeycomb-style ventilated design to improve airflow and help items dry faster. Water is collected below and guided into the sink through a removable drain plate. &amp;nbsp; This project is fully modular and requires no glue, screws, or tools . All parts are designed to snap together , making assembly, cleaning, and disassembly simple. &amp;nbsp; &amp;nbsp; &amp;nbsp; The model also includes optional feet . These can be used when the sink edge sits higher than the countertop, allowing the organizer to be raised so the drain plate can direct water straight into the sink. If your sink is flush with the countertop, the feet are not necessary. &amp;nbsp; &amp;nbsp; For better durability in a wet kitchen environment, PETG is the preferred material. &amp;nbsp; New: you can now add a cutlery drainer to the modular set. &amp;nbsp; Assembly Snap the upper basket into the main frame. Install the drain plate in the lower section. Attach the optional feet only if extra height is needed. Position the drain plate so water flows directly into the sink. No glue is required. New in House of Things: &amp;nbsp;</description><price>385</price><currencyId>RUR</currencyId><categoryId>21</categoryId><picture>https://sun9-12.vkuserphoto.ru/s/v1/ig2/Kd_XbLjo38ZIWyrFcL8v_OvswXkilQ-HQdI_-A6b9OdNyGpphVM36Hj_2udTkt64_GR2PzOXuvDKYlouS0svzUOW.jpg?quality=96&amp;from=bu&amp;cs=1448x0</picture><url>https://makerworld.com/en/models/3128751-self-draining-sink-caddy-detergent-sponge-cutlery</url><vendor>Tolentino Studio</vendor></offer><offer id="printshop-4" available="true"><name>Лиса в стиле japandi</name><description>Эта стильная фигурка лисы в стиле japandi станет изысканным дополнением вашего интерьера. Она идеально впишется в современные и минималистичные пространства, добавляя нотки уюта и оригинальности. Изготовленная из пластика для 3D-печати, фигурка отличается высокой прочностью и долговечностью. Вы можете разместить её на столе, полке или в витрине, она станет ярким акцентом в вашем доме или офисе. Уход за фигуркой прост: достаточно протирать её сухой или слегка влажной тканью, а также беречь от сильного нагрева. Этот предмет станет отличным подарком для любителей уникального дизайна и ценителей японской эстетики.</description><price>399</price><currencyId>RUR</currencyId><categoryId>18</categoryId><picture>https://sun9-42.vkuserphoto.ru/s/v1/ig2/qNFp_j4-GKhuC_2kAKlXHaILQ6R6Z7J-hABJDibKwUOtGeD8R-pXeCs_6kn3RT4l50YumVsWs6mNVyxEjVyUZihk.jpg?quality=96&amp;from=bu&amp;cs=1448x0</picture><url>https://makerworld.com/en/models/3156254-fox-cute-animal-stylish-japandi-style</url><vendor>NowCraft3D</vendor></offer><offer id="printshop-5" available="true"><name>Часы Voronoi на стену</name><description>Эти часы Voronoi — стильный элемент декора для вашего интерьера. Они объединяют современный дизайн 3D-печати с естественной эстетикой, что делает их идеальными для любого помещения. Часы имеют модульную конструкцию, позволяющую легко менять лицевую панель, что дает возможность адаптировать их под ваш стиль. Вы можете выбрать из четырех различных рамок и двух лицевых панелей, чтобы создать уникальный предмет, который будет радовать глаз. Изготовлены из пластика для 3D-печати, они легки в уходе: достаточно протирать их сухой или слегка влажной тканью и беречь от сильного нагрева. Эти часы отлично подойдут для дома, офиса или студии, добавляя нотку современности и оригинальности. Они станут отличным подарком для ценителей дизайна и искусства. Привнесите в ваше пространство уникальный акцент с помощью этих часов.</description><price>2381</price><currencyId>RUR</currencyId><categoryId>18</categoryId><picture>https://sun9-12.vkuserphoto.ru/s/v1/ig2/pr4He4Yci10iqTvNqtW88OgU7smghOCMDSo2dzAcBY4hd2LQqfW_rKDNjGH8qU8Vnm-8ciUSNsh0YimXaesLqyOe.jpg?quality=96&amp;from=bu&amp;cs=1313x0</picture><url>https://makerworld.com/en/models/3156005-modern-voronoi-wall-clock-organic-or-circular</url><vendor>Artimago</vendor></offer><offer id="printshop-6" available="true"><name>Пара оленей Japandi</name><description>Эта пара оленей — стильный элемент декора в стиле Japandi и Nordic. Они идеально подойдут для украшения полок, столов и каминов, добавляя изысканность в ваш интерьер. Олени выполнены с плавными линиями и элегантными рогами, что делает их универсальными для любого современного пространства. Вы можете выбрать их в подходящих или контрастных цветах, создавая уникальный набор, который будет радовать глаз. Эти фигурки также станут прекрасным зимним или рождественским украшением. Изготовлены из пластика для 3D-печати, их легко поддерживать в чистоте — достаточно протирать сухой или слегка влажной тканью. Берегите от сильного нагрева, чтобы сохранить их первоначальный вид. Этот декор станет отличным подарком для ценителей минимализма и современного дизайна.</description><price>170</price><currencyId>RUR</currencyId><categoryId>18</categoryId><picture>https://sun9-73.vkuserphoto.ru/s/v1/ig2/lgbHzWJuArJG9iHJeQqdzzgzwTeDNJem_5eUnvZSfVzmZrWhaaANk6K2FPsGOoG8KfPKzKbieuKY4earYuFAQ2Ms.jpg?quality=96&amp;from=bu&amp;cs=1448x0</picture><url>https://makerworld.com/en/models/3164895-minimalist-deer-couple-japandi-christmas-home</url><vendor>NowCraft3D</vendor></offer><offer id="printshop-7" available="true"><name>Стакан для щёток Japandi</name><description>Стакан для щёток в стиле Japandi — идеальное решение для организации вашего пространства в ванной. Этот стильный и компактный аксессуар поможет аккуратно разместить ваши зубные щётки и пасту, обеспечивая легкий доступ к ним. Вы можете выбрать между двумя версиями: на 2 слота для электрических щёток и пасты или на 4-6 слотов для большего количества принадлежностей. Стакан прекрасно впишется в интерьер ванной комнаты, добавляя ей изящества и минимализма. Изготовлен из пластика для 3D-печати, он легок в уходе: достаточно протирать его сухой или слегка влажной тканью, а также беречь от сильного нагрева. Этот аксессуар станет отличным выбором для семейных ванных комнат или общих пространств, где важно поддерживать порядок и стиль.</description><price>484</price><currencyId>RUR</currencyId><categoryId>21</categoryId><picture>https://sun9-64.vkuserphoto.ru/s/v1/ig2/bFnWGYh55O0dk8E-QndbFGppebg6eVPSyWZ84k7mPaDXpiu2jhIIM5ZPbVgbRuM3_DVtg4OP3Byw5lEF2XMXpOBi.jpg?quality=96&amp;from=bu&amp;cs=1024x0</picture><url>https://makerworld.com/en/models/3168927-toothbrush-holder-japandi</url><vendor>Kien Designs</vendor></offer><offer id="printshop-8" available="true"><name>Сканди-горшок с поддоном</name><description>Сканди-горшок с поддоном — это стильный и функциональный элемент для вашего интерьера. Он выполнен в современном скандинавском дизайне, который добавит уют и архитектурную изысканность в любое помещение. Горшок подходит для различных растений: от зелени до суккулентов, а также может использоваться как кашпо. В комплект входят поддон и вставка для дренажа, что обеспечивает правильный уход за растениями. Вы можете разместить горшок на столе, подоконнике или полке, создавая гармоничное оформление. Изготовлен из пластика для 3D-печати, он легкий и долговечный. Уход за горшком прост: достаточно протирать его сухой или слегка влажной тканью, избегая сильного нагрева. Этот горшок станет отличным выбором для любителей минимализма и тех, кто ценит стильные решения в интерьере.</description><price>599</price><currencyId>RUR</currencyId><categoryId>18</categoryId><picture>https://sun9-15.vkuserphoto.ru/s/v1/ig2/UIPuHAfuX9cT4oJHTdUTmktsjWpmOS_-SP7O9pxXwHwKN_2uG3WtjUNka1cGGrH1O0Kl_mJYgqZa1yXlybY4AX6f.jpg?quality=96&amp;from=bu&amp;cs=1600x0</picture><url>https://makerworld.com/en/models/3166644-scandi-style-quilt-flower-pot-with-drainage-tray</url><vendor>Ikigaiform</vendor></offer><offer id="printshop-9" available="true"><name>Подсвечник «лесное яблоко»</name><description>Подсвечник в форме яблока создаст уютную атмосферу в вашем доме. Он выполнен из пластика для 3D-печати и украшен деталями в виде дубовых листьев и желудей, что придаёт ему природный шарм. Этот подсвечник идеально подойдёт для осеннего декора, добавляя тёплый свет в вечерние часы. Просто вставьте LED-свечу внутрь, и он заиграет новыми красками, создавая красивые тени и уютное освещение. Подсвечник станет отличным акцентом на столе, полке или камине, а также станет замечательным подарком для любителей природы и осенней эстетики. Уход за изделием прост: достаточно протирать его сухой или слегка влажной тканью, избегая сильного нагрева. Этот предмет станет не только функциональным аксессуаром, но и стильным элементом вашего интерьера на протяжении всей осени.</description><price>2704</price><currencyId>RUR</currencyId><categoryId>18</categoryId><picture>https://sun9-60.vkuserphoto.ru/s/v1/ig2/5ewlZJ2sMYK9VxPQnkMRnpyYwaaIWUHjJMKnIfwM2-V3G_MmQnfBe9Tn_eDV7v4n00hURmlBTKAvXUPZ-XSW_L5U.jpg?quality=96&amp;from=bu&amp;cs=1024x0</picture><url>https://makerworld.com/en/models/3169733-forest-fall-glow-apple-led-tealight-holder</url><vendor>Swee</vendor></offer><offer id="printshop-10" available="true"><name>Фонарик-жёлудь</name><description>Фонарик-жёлудь — это оригинальный элемент осеннего декора, который можно как установить на стол, так и повесить, используя специальную петлю. Внутри фонарика предусмотрено место для маленького баллонного света, что позволяет создать уютную атмосферу в вашем доме. Благодаря компактным размерам (высота около 50 мм) он легко впишется в любой интерьер. Вы можете выбрать цвет печати для достижения желаемого эффекта освещения: светлые оттенки лучше пропускают свет, а темные создают более мягкое свечение. Фонарик идеально подходит для украшения дома в осенний период, а также станет отличным подарком для любителей уютного декора. Изготовлен из пластика для 3D-печати, фонарик легко чистится — достаточно протереть его сухой или слегка влажной тканью. Берегите изделие от сильного нагрева, чтобы оно служило вам долго.</description><price>200</price><currencyId>RUR</currencyId><categoryId>18</categoryId><picture>https://sun9-23.vkuserphoto.ru/s/v1/ig2/OCkpGQISVOuw8pdH9MNwrLQk7k4KYWpyM0mTTFPZPw7BYCGMYd9ojnjEElCuCnsDaw-qQavVfybek3vGKrutKIyD.jpg?quality=96&amp;from=bu&amp;cs=1448x0</picture><url>https://makerworld.com/en/models/3171935-mini-acorn-lantern-autumn-decoration</url><vendor>3DMerchandMore</vendor></offer><offer id="printshop-11" available="true"><name>Подставка для фруктов с держателем для бананов</name><description>Эта современная минималистичная подставка для фруктов станет стильным дополнением вашей кухни. Она оснащена специальным держателем для бананов, что позволяет сохранить их свежесть и предотвратить повреждения. Съемная решетка упрощает уход за подставкой: ее легко мыть, 